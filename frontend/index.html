<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Hub</title>
<style>
  :root {
    --bg: #0f0f10;
    --surface: #18181b;
    --surface-2: #222226;
    --surface-3: #2a2a2f;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.14);
    --text: #e4e4e0;
    --text-muted: #7a7a74;
    --text-dim: #444442;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; display: flex; flex-direction: column; }

  /* TOPBAR */
  .topbar { height: 44px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0; background: var(--surface); }
  .topbar-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .topbar-sep { width: 1px; height: 16px; background: var(--border-strong); }
  .topbar-sub { font-size: 12px; color: var(--text-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  /* HAMBURGER — the sidebar is a drawer on narrow screens */
  .hamburger { display: none; width: 44px; height: 44px; margin-left: -12px; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; color: var(--text-muted); flex-shrink: 0; }
  .hamburger:hover { color: var(--text); }
  .hamburger span { display: block; width: 17px; height: 1.5px; background: currentColor; border-radius: 1px; box-shadow: 0 -5px 0 currentColor, 0 5px 0 currentColor; }
  .scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; }
  .scrim.open { display: block; }

  /* FILTER CHIP — the way back to All brands */
  .filter-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 3px 6px 3px 9px; border-radius: 100px; background: var(--surface-3); color: var(--text); border: 1px solid var(--border-strong); cursor: pointer; font-family: var(--font); white-space: nowrap; }
  .filter-chip:hover { border-color: rgba(255,255,255,.28); }
  .filter-chip .x { font-size: 13px; line-height: 1; opacity: .6; }

  /* LAYOUT */
  .layout { display: flex; flex: 1; overflow: hidden; }

  /* SIDEBAR — jump-to only. Brand buckets live on the board itself. */
  .sidebar { width: 200px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; overflow-y: auto; }
  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
  .sb-section { padding: 14px 0 6px; }
  .sb-label { font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--text-dim); padding: 0 12px 5px; }
  .sb-item { display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer; border: none; background: none; width: 100%; text-align: left; color: var(--text-muted); font-size: 13px; font-family: var(--font); transition: background .1s, color .1s; }
  .sb-item:hover { background: var(--surface-2); color: var(--text); }
  .sb-item.active { background: var(--surface-2); color: var(--text); font-weight: 500; }
  .sb-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .sb-name { flex: 1; }
  .sb-badge { font-size: 10px; font-weight: 600; min-width: 16px; height: 15px; border-radius: 8px; background: var(--surface-3); color: var(--text-muted); display: flex; align-items: center; justify-content: center; padding: 0 4px; }
  .sb-badge.waiting { background: rgba(239,159,39,.2); color: #f0b84a; }

  /* BOARD */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .board { flex: 1; overflow-y: auto; padding: 18px 20px 60px; display: flex; flex-direction: column; gap: 30px; scroll-behavior: smooth; }
  .board::-webkit-scrollbar { width: 3px; }
  .board::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

  .btn { font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border-strong); background: none; color: var(--text-muted); cursor: pointer; font-family: var(--font); transition: background .1s, color .1s; }
  .btn:hover { background: var(--surface-2); color: var(--text); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-primary { background: var(--surface-2); color: var(--text); }

  /* BRAND SECTION — the primary structure of the board */
  .brand-section { display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 12px; }
  .brand-header { display: flex; align-items: center; gap: 10px; padding-bottom: 9px; border-bottom: 1px solid var(--border); }
  .brand-bar { width: 4px; height: 20px; border-radius: 2px; background: var(--brand); flex-shrink: 0; }
  .brand-name { font-size: 15px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text); }
  .brand-meta { margin-left: auto; font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
  .brand-waiting { color: #f0b84a; font-weight: 600; }

  /* BUCKETS — In flight / Queued / Backlog, in that order, within each brand */
  .buckets { display: flex; flex-direction: column; gap: 16px; }
  .bucket { display: flex; flex-direction: column; gap: 8px; }
  .bucket-label { font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text-dim); }

  /* SESSION CARD — the card itself carries the brand colour */
  .session-card { border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--surface); border-left-width: 3px; border-left-style: solid; }
  .session-card.needs-decision { box-shadow: 0 0 0 1px rgba(240,184,74,.3); }
  .session-top { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; flex-wrap: wrap; }
  .session-id { font-size: 11px; font-family: var(--mono); color: var(--text-muted); }
  .session-title { font-size: 13px; color: var(--text); font-weight: 500; flex: 1; min-width: 100px; }
  .stage-pill { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 100px; background: var(--surface-3); color: var(--text-muted); white-space: nowrap; }
  .stage-pill.needs-decision { background: rgba(239,159,39,.18); color: #f0b84a; }
  .session-track { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }
  .session-detail { padding: 0 12px 8px; font-size: 12px; color: var(--text-muted); line-height: 1.45; }
  .session-actions { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .session-links { display: flex; gap: 6px; margin-left: auto; }
  .no-research-toggle { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .reassign-select { font-size: 11px; background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border-strong); border-radius: 5px; padding: 2px 4px; font-family: var(--font); }
  .reassign-select option { background: #222226; }
  .empty-bucket { font-size: 11px; color: var(--text-dim); font-style: italic; padding: 2px 0; }
  .agent-reply { flex: 1; min-width: 180px; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 6px; padding: 7px 10px; font-size: 13px; color: var(--text); font-family: var(--font); outline: none; }
  .agent-reply:focus { border-color: rgba(255,255,255,.25); }
  .agent-link { font-size: 12px; color: var(--text-muted); text-decoration: none; padding: 4px 9px; border: 1px solid var(--border-strong); border-radius: 6px; flex-shrink: 0; }
  .agent-link:hover { color: var(--text); }

  /* SIDE PANEL — persistent, all in-flight work across every brand */
  .side-panel { width: 220px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--surface); overflow-y: auto; padding: 12px 0; }
  .side-panel::-webkit-scrollbar { width: 3px; }
  .side-panel::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
  .sp-title { font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--text-dim); padding: 0 12px 8px; }
  .sp-group-label { font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-dim); padding: 10px 12px 4px; }
  .sp-item { display: flex; align-items: center; gap: 7px; padding: 5px 12px; cursor: pointer; border: none; background: none; width: 100%; text-align: left; font-family: var(--font); }
  .sp-item:hover { background: var(--surface-2); }
  .sp-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .sp-text { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp-empty { padding: 8px 12px; font-size: 11px; color: var(--text-dim); font-style: italic; }

  /* EMPTY / TOAST */
  .empty { text-align: center; padding: 48px 24px; color: var(--text-dim); font-size: 13px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface-3); border: 1px solid var(--border-strong); border-radius: 8px; padding: 10px 16px; font-size: 13px; color: var(--text); z-index: 200; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ── MOBILE ──────────────────────────────────────────────────────────
     Below 900px the page scrolls as one document instead of three
     independently-scrolling columns: sidebar becomes a drawer, the side
     panel moves below the board, and every control clears 44px. */
  @media (max-width: 900px) {
    /* Let the document itself scroll rather than a pane inside a fixed-height
       body — iOS Safari handles sticky and momentum scrolling far better. */
    html, body { height: auto; min-height: 100%; overflow: visible; }
    .topbar { position: sticky; top: 0; z-index: 30; }
    .hamburger { display: flex; }
    .layout { flex-direction: column; overflow: visible; }
    .main { overflow: visible; }
    .board { overflow: visible; padding: 14px 12px 32px; gap: 26px; }

    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 264px; z-index: 50;
               transform: translateX(-100%); transition: transform .18s ease;
               border-right: 1px solid var(--border-strong); }
    .sidebar.open { transform: none; }
    .sb-item { min-height: 44px; font-size: 15px; }
    .sb-badge { min-width: 20px; height: 20px; font-size: 11px; }

    /* Below the board, not beside it — "what is running" is worth a scroll,
       and a 220px rail on a phone is not. */
    .side-panel { width: auto; overflow: visible; border-left: none;
                  border-top: 1px solid var(--border); padding: 14px 0 28px; }

    /* Tap targets — 44px minimum on everything you press. */
    .session-top, .session-detail, .session-actions { padding-left: 14px; padding-right: 14px; }
    .session-actions { gap: 8px; padding-top: 10px; padding-bottom: 10px; }
    .btn { min-height: 44px; padding: 0 16px; }
    .no-research-toggle { min-height: 44px; padding: 0 8px 0 4px; font-size: 13px; }
    .no-research-toggle input { width: 20px; height: 20px; }
    .reassign-select { min-height: 44px; padding: 0 8px; font-size: 13px; }
    .agent-link { min-height: 44px; display: inline-flex; align-items: center; }
    .agent-reply { min-height: 44px; width: 100%; flex-basis: 100%; }
    .session-links { margin-left: 0; }
    .sp-item { min-height: 40px; }
  }

  @media (max-width: 600px) {
    .brand-name { font-size: 14px; }
    .session-title { font-size: 14px; line-height: 1.35; }
    .topbar { padding: 0 12px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Brands"><span></span></button>
  <div class="topbar-title">Design Hub</div>
  <div class="topbar-sep"></div>
  <div class="topbar-sub" id="topbar-sub">Loading…</div>
  <div class="topbar-actions">
    <button class="filter-chip" id="filter-chip" style="display:none" onclick="setFilter(null)"></button>
    <button class="btn" id="btn-refresh" onclick="loadBoard()">Refresh</button>
  </div>
</div>

<div class="scrim" id="scrim" onclick="closeMenu()"></div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="board" id="board"><div class="empty">Loading…</div></div>
  </div>
  <div class="side-panel" id="side-panel"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// Same-origin. A Pages Function at /api/* proxies to the Worker — see
// functions/api/[[path]].js. Calling the Worker directly would be a
// cross-origin request, which Access cannot authenticate from a browser.
const API = '/api';

// Every brand gets a section on the board whether or not it has work today —
// an empty CONDUIT is information, not clutter.
let brands = [];
let brandsById = {};
let sessions = [];

// null = All brands. Deliberately not persisted: the board opens showing
// everything, every time. Filtering is something you opt into for a moment,
// not a state you get stuck in.
let filterBrand = null;

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Element ids are derived from session ids, which contain '/' and '-'.
// btoa would choke on any non-Latin1 character, so hash to hex instead.
function key(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = ((h << 5) - h + id.charCodeAt(i)) | 0;
  return (h >>> 0).toString(16);
}

function timeAgo(ts) {
  if (!ts) return '';
  const then = new Date(ts.replace(' ', 'T') + 'Z');
  const mins = Math.floor((Date.now() - then) / 60000);
  if (isNaN(mins)) return '';
  if (mins < 1) return 'now';
  if (mins < 60) return mins + 'm';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h';
  return Math.floor(hrs / 24) + 'd';
}

// ── BUCKETING ──────────────────────────────────────

// Which of the three per-brand buckets a session belongs in.
function bucketOf(r) {
  if (r.triggered_at) return 'inflight';
  if (r.linear_state === 'backlog') return 'backlog';
  return 'queued'; // unstarted (Todo), or no Linear state at all
}

// Research / Design / QA / Waiting on me
function stageLabel(r) {
  if (r.status === 'waiting') return 'Waiting on me';
  if (!r.phase) return '—';
  if (r.phase.toLowerCase() === 'qa') return 'QA';
  return r.phase.charAt(0).toUpperCase() + r.phase.slice(1);
}

function needsDecision(r) {
  return r.status === 'waiting' && !!r.triggered_at;
}

// ── CARD ───────────────────────────────────────────

function sessionCard(r) {
  const decision = needsDecision(r);
  const bucket = bucketOf(r);
  const color = (brandsById[r.project] || {}).color || '#888780';
  const id = r.id;
  const k = key(id);

  const linksHtml = `<div class="session-links">
    ${r.url ? `<a class="agent-link" href="${esc(r.url)}" target="_blank" rel="noopener">Linear ↗</a>` : ''}
    ${r.figma_url ? `<a class="agent-link" href="${esc(r.figma_url)}" target="_blank" rel="noopener">Figma ↗</a>` : ''}
  </div>`;

  const reassignHtml = `<select class="reassign-select" onchange="reassignSession('${esc(id)}', this.value)">
    <option value="">Move to…</option>
    ${brands.filter(b => b.id !== r.project).map(b =>
      `<option value="${esc(b.id)}">${esc(b.name)}</option>`).join('')}
  </select>`;

  let actionsHtml;
  if (bucket !== 'inflight') {
    // Not yet triggered — the only job of this card is the trigger button.
    actionsHtml = `
      <label class="no-research-toggle">
        <input type="checkbox" id="nr-${k}"> no-research
      </label>
      <button class="btn btn-primary" onclick="triggerSession('${esc(id)}', 'go', this)">Trigger</button>
      ${reassignHtml}
      ${linksHtml}`;
  } else if (decision) {
    // In flight and waiting on me — free-text reply, plus the QA button for
    // "my Figma work is done, run QA".
    actionsHtml = `
      <input class="agent-reply" id="reply-${k}" placeholder="Your decision…"
        onkeydown="if(event.key==='Enter')respondAgent('${esc(id)}', this)">
      <button class="btn btn-primary" onclick="respondAgent('${esc(id)}', document.getElementById('reply-${k}'))">Send</button>
      <button class="btn" onclick="triggerSession('${esc(id)}', 'qa', this)">Run QA</button>
      ${reassignHtml}
      ${linksHtml}`;
  } else {
    actionsHtml = `${reassignHtml}${linksHtml}`;
  }

  return `<div class="session-card ${decision ? 'needs-decision' : ''}" style="border-left-color:${color}">
    <div class="session-top">
      <span class="session-id">${esc(r.linear_id || r.id)}</span>
      <span class="session-title">${esc(r.title || r.detail || '')}</span>
      <span class="stage-pill ${decision ? 'needs-decision' : ''}">${esc(stageLabel(r))}</span>
      ${r.track ? `<span class="session-track">${esc(r.track)}</span>` : ''}
      ${r.updated_at ? `<span class="session-track">${timeAgo(r.updated_at)}</span>` : ''}
    </div>
    ${r.prompt ? `<div class="session-detail">${esc(r.prompt)}</div>`
              : (r.detail ? `<div class="session-detail">${esc(r.detail)}</div>` : '')}
    ${r.response ? `<div class="session-detail">Answered <b>${esc(r.response)}</b> · ${timeAgo(r.responded_at)} ago</div>` : ''}
    <div class="session-actions">${actionsHtml}</div>
  </div>`;
}

// ── BOARD ──────────────────────────────────────────

function bucketsFor(rows) {
  const section = (label, list) => `
    <div class="bucket">
      <div class="bucket-label">${label}</div>
      ${list.length ? list.map(sessionCard).join('') : '<div class="empty-bucket">Nothing here</div>'}
    </div>`;
  return `<div class="buckets">
    ${section('In flight', rows.filter(r => bucketOf(r) === 'inflight'))}
    ${section('Queued',    rows.filter(r => bucketOf(r) === 'queued'))}
    ${section('Backlog',   rows.filter(r => bucketOf(r) === 'backlog'))}
  </div>`;
}

function brandSection(brand, rows) {
  const waiting = rows.filter(needsDecision).length;
  return `<section class="brand-section" id="brand-${esc(brand.id)}" style="--brand:${esc(brand.color)}">
    <div class="brand-header">
      <div class="brand-bar"></div>
      <div class="brand-name">${esc(brand.name)}</div>
      <div class="brand-meta">
        ${waiting ? `<span class="brand-waiting">${waiting} waiting on me</span>` : ''}
        <span>${rows.length} open</span>
      </div>
    </div>
    ${bucketsFor(rows)}
  </section>`;
}

const UNASSIGNED = { id: '_unassigned', name: 'Unassigned', color: '#888780' };

function rowsFor(brandId) {
  return brandId === UNASSIGNED.id
    ? sessions.filter(r => !brandsById[r.project])
    : sessions.filter(r => r.project === brandId);
}

async function loadBoard() {
  const btn = document.getElementById('btn-refresh');
  if (btn) btn.disabled = true;
  try {
    const [brandRows, rows] = await Promise.all([api('/brands'), api('/agent/sessions')]);
    brands = brandRows.map(b => ({ id: b.id, name: b.name, color: b.color }));
    brandsById = Object.fromEntries(brands.map(b => [b.id, b]));
    sessions = rows;
    renderBoard();
  } catch (e) {
    document.getElementById('board').innerHTML =
      `<div class="empty">Could not load the board.<br>${esc(String(e.message || e))}</div>`;
  } finally {
    if (btn) btn.disabled = false;
  }
}

// Renders from what is already in memory — filtering never refetches.
function renderBoard() {
  // Anything the reader could not place gets its own section rather than
  // vanishing off the board; the reassign select is how it gets home.
  const unplaced = rowsFor(UNASSIGNED.id);
  const shown = filterBrand
    ? [...brands, UNASSIGNED].filter(b => b.id === filterBrand)
    : [...brands, ...(unplaced.length ? [UNASSIGNED] : [])];

  document.getElementById('board').innerHTML = shown.length
    ? shown.map(b => brandSection(b, rowsFor(b.id))).join('')
    : '<div class="empty">Nothing here.</div>';

  renderSidebar(unplaced.length);
  renderSidePanel();
  renderTopbar();
}

function renderTopbar() {
  const scope = filterBrand ? rowsFor(filterBrand) : sessions;
  const waiting = scope.filter(needsDecision).length;
  const short = window.matchMedia('(max-width: 600px)').matches;
  document.getElementById('topbar-sub').textContent = waiting
    ? `${waiting} waiting${short ? '' : ' on you'} · ${scope.length} open`
    : `${scope.length} open`;

  // The chip is the way back to All brands, and the only always-visible
  // signal that you are looking at a subset.
  const chip = document.getElementById('filter-chip');
  const brand = filterBrand === UNASSIGNED.id ? UNASSIGNED : brandsById[filterBrand];
  if (brand) {
    chip.innerHTML = `${esc(brand.name)}<span class="x">×</span>`;
    chip.style.display = 'inline-flex';
    chip.title = 'Back to all brands';
  } else {
    chip.style.display = 'none';
  }
}

function renderSidebar(unplacedCount) {
  // The badge counts what needs me, not how much exists. Total open is already
  // in every brand header on the board; repeating it here would be noise.
  const item = b => {
    const waiting = rowsFor(b.id).filter(needsDecision).length;
    const active = filterBrand === b.id ? ' active' : '';
    return `<button class="sb-item${active}" onclick="setFilter('${esc(b.id)}')">
      <div class="sb-dot" style="background:${esc(b.color)}"></div>
      <span class="sb-name">${esc(b.name)}</span>
      ${waiting ? `<span class="sb-badge waiting">${waiting}</span>` : ''}
    </button>`;
  };
  const allWaiting = sessions.filter(needsDecision).length;
  const allItem = `<button class="sb-item${filterBrand ? '' : ' active'}" onclick="setFilter(null)">
      <div class="sb-dot" style="background:var(--text-dim)"></div>
      <span class="sb-name">All brands</span>
      ${allWaiting ? `<span class="sb-badge waiting">${allWaiting}</span>` : ''}
    </button>`;
  const extra = unplacedCount ? item(UNASSIGNED) : '';
  document.getElementById('sidebar').innerHTML =
    `<div class="sb-section"><div class="sb-label">Brands</div>${allItem}${brands.map(item).join('')}${extra}</div>`;
}

// Tapping a brand narrows the board to it; the chip and "All brands" both undo
// it. null restores the stacked everything-view the board opens with.
function setFilter(id) {
  filterBrand = id;
  renderBoard();
  closeMenu();
  const board = document.getElementById('board');
  if (board) board.scrollTop = 0;
  window.scrollTo(0, 0);
}

function toggleMenu() {
  const open = document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('open', open);
}

function closeMenu() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
}

// ── SIDE PANEL — all in-flight work across every brand, App / Website ──

function renderSidePanel() {
  const inFlight = sessions.filter(r => r.triggered_at && ['active','waiting','error'].includes(r.status));
  const item = r => {
    const color = (brandsById[r.project] || {}).color || '#888780';
    return `<button class="sp-item" onclick="setFilter('${esc(brandsById[r.project] ? r.project : UNASSIGNED.id)}')">
      <span class="sp-dot" style="background:${color}"></span>
      <span class="sp-text">${esc(r.linear_id || r.id)} — ${esc(stageLabel(r))}</span>
    </button>`;
  };
  const app = inFlight.filter(r => r.track === 'app');
  const web = inFlight.filter(r => r.track !== 'app');
  document.getElementById('side-panel').innerHTML = `
    <div class="sp-title">In flight</div>
    <div class="sp-group-label">App</div>
    ${app.length ? app.map(item).join('') : '<div class="sp-empty">Nothing running</div>'}
    <div class="sp-group-label">Website</div>
    ${web.length ? web.map(item).join('') : '<div class="sp-empty">Nothing running</div>'}
  `;
}

// ── ACTIONS ────────────────────────────────────────

async function triggerSession(id, action, btn) {
  const nrBox = document.getElementById('nr-' + key(id));
  const noResearch = !!(nrBox && nrBox.checked);
  const original = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    await api(`/agent/session/${encodeURIComponent(id)}/trigger`, {
      method: 'POST', body: { action, noResearch },
    });
    toast(action === 'go' ? (noResearch ? 'Triggered — no research' : 'Triggered') : 'QA requested');
    await window.addEventListener('resize', () => { if (sessions.length) renderTopbar(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

loadBoard();
  } catch (e) {
    toast('Trigger failed — ' + String(e.message || e).slice(0, 120));
    if (btn) { btn.disabled = false; btn.textContent = original; }
  }
}

async function reassignSession(id, project) {
  if (!project) return;
  try {
    await api(`/agent/session/${encodeURIComponent(id)}/reassign`, {
      method: 'PATCH', body: { project },
    });
    toast('Moved to ' + ((brandsById[project] || {}).name || project));
    await loadBoard();
  } catch { toast('Could not move'); }
}

async function respondAgent(id, inputEl) {
  const value = (inputEl && inputEl.value || '').trim();
  if (!value) return;
  try {
    await api(`/agent/session/${encodeURIComponent(id)}/respond`, {
      method: 'PATCH', body: { response: value },
    });
    toast('Answer sent');
    await loadBoard();
  } catch { toast('Could not send response'); }
}

loadBoard();
</script>
